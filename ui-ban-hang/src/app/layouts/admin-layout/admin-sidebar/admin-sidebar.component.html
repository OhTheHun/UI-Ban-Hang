<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-area">
      <h2 class="logo-text">Operations Panel</h2>
      <p class="logo-subtext">Hệ thống quản trị</p>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a *ngIf="canSeeDashboard()" routerLink="/Operations/dashboard" routerLinkActive="active" class="nav-link">
      <i class="ph ph-squares-four"></i>
      <span>Bảng điều khiển</span>
    </a>

    <a *ngIf="canSeeUsers()" routerLink="/Operations/staff" routerLinkActive="active" class="nav-link">
      <i class="ph ph-users-three"></i>
      <span>Quản lý nhân viên</span>
    </a>

    <a *ngIf="canSeeProducts()" routerLink="/Operations/products" routerLinkActive="active" class="nav-link">
      <i class="ph ph-package"></i>
      <span>Sản phẩm</span>
    </a>

    <a *ngIf="canSeeOrders()" routerLink="/Operations/orders" routerLinkActive="active" class="nav-link">
      <i class="ph ph-shopping-cart"></i>
      <span>Hóa đơn</span>
    </a>

    <a *ngIf="canSeeSuppliers()" routerLink="/Operations/suppliers" routerLinkActive="active" class="nav-link">
      <i class="ph ph-truck"></i>
      <span>Nhà cung cấp</span>
    </a>

    <a *ngIf="canSeeImports()" routerLink="/Operations/import" routerLinkActive="active" class="nav-link">
      <i class="ph ph-download-simple"></i>
      <span>Nhập kho</span>
    </a>

    <a *ngIf="canSeeApprovals()" routerLink="/Operations/approvals" routerLinkActive="active" class="nav-link">
      <i class="ph ph-check-square"></i>
      <span>Phê duyệt đơn</span>
    </a>

    <a *ngIf="canSeeReports()" routerLink="/Operations/reports" routerLinkActive="active" class="nav-link">
      <i class="ph ph-chart-bar"></i>
      <span>Báo cáo tài chính</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="btn-quick-report">
      Xuất báo cáo nhanh
    </button>

    <div class="footer-links">
      <a routerLink="/Operations/account" routerLinkActive="active" class="footer-link">
        <i class="ph ph-user-circle"></i>
        <span>Tài khoản</span>
      </a>

      <button (click)="logout()" class="footer-link logout">
        <i class="ph ph-sign-out"></i>
        <span>Đăng xuất</span>
      </button>
    </div>
  </div>
</aside>
