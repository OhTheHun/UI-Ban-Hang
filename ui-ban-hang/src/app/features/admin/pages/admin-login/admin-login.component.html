<div class="admin-login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <i class="ph-fill ph-shield-check"></i>
      </div>
      <h2>Quản trị hệ thống</h2>
      <p>Đăng nhập dành cho Admin, Nhân viên, Quản lý kho & HR</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <div class="input-container">
          <i class="ph ph-user"></i>
          <input type="text" formControlName="username" placeholder="Nhập username..." />
        </div>
        <small class="error" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
          Vui lòng nhập tên đăng nhập
        </small>
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <div class="input-container">
          <i class="ph ph-lock"></i>
          <input type="password" formControlName="password" placeholder="Nhập mật khẩu..." />
        </div>
        <small class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Vui lòng nhập mật khẩu
        </small>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading">
        <span *ngIf="!loading">Đăng nhập</span>
        <span *ngIf="loading" class="loader"></span>
      </button>
    </form>
  </div>
</div>
