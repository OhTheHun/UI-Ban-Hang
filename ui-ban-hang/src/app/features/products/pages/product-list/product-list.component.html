<div class="product-list-container">
  <div class="container">

    <div class="header-section">
      <h1 class="page-title">{{ searchTitle }}</h1>
    </div>

    <ng-container *ngIf="vm$ | async as vm">

      <!-- LOADING -->
      <div class="loading-spinner" *ngIf="vm.loading">
        <div class="spinner"></div>
        <p>Đang tải sản phẩm...</p>
      </div>

      <!-- EMPTY -->
      <div class="empty-state" *ngIf="!vm.loading && vm.products.length === 0">
        <h3>Không tìm thấy sản phẩm nào</h3>
      </div>

      <!-- DATA -->
      <div class="products-grid" *ngIf="!vm.loading && vm.products.length > 0">
        <app-product-card *ngFor="let product of vm.products; trackBy: trackByProductId" [product]="product">
        </app-product-card>
      </div>

      <!-- COUNT -->
      <div class="results-count" *ngIf="!vm.loading">
        Tìm thấy {{ vm.products.length }} sản phẩm
      </div>

    </ng-container>

  </div>
</div>
