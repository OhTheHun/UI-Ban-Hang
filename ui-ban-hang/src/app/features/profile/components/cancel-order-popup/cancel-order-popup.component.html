<div class="popup-backdrop" (click)="onCancel.emit()">
  <div class="popup-window" (click)="$event.stopPropagation()">
    <div class="popup-icon-warning">
      <i class="ph-fill ph-warning-circle"></i>
    </div>

    <div class="popup-content">
      <h3>Xác nhận hủy đơn</h3>
      <p>Bạn có chắc chắn muốn hủy đơn hàng này không? Thao tác này không thể hoàn tác.</p>

      <label class="reason-field">
        <span>Lý do hủy đơn</span>
        <textarea
          [(ngModel)]="reason"
          rows="4"
          maxlength="300"
          placeholder="Nhập lý do hủy đơn hàng...">
        </textarea>
      </label>

      <div class="reason-footer">
        <span class="error-message" *ngIf="submitted && !reason.trim()">Vui lòng nhập lý do hủy đơn.</span>
        <span class="char-count">{{ reason.length }}/300</span>
      </div>
    </div>

    <div class="popup-actions">
      <button class="btn-cancel" (click)="onCancel.emit()">Quay lại</button>
      <button class="btn-confirm" (click)="confirm()">Đồng ý hủy</button>
    </div>
  </div>
</div>
